services:
  aerolog:
    image: ghcr.io/pierredesgranges-blip/aerolog:1.0.0
    environment:
      - TZ=${TZ}
      - AEROLOG_PASSWORD=${AEROLOG_PASSWORD}
      - AEROLOG_SECRET=${AEROLOG_SECRET}
    volumes:
      - ${APP_DATA_DIR}/data:/data
    healthcheck:
      test: wget -qO- http://127.0.0.1:8080/healthz || exit 1
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    x-runtipi:
      is_main: true
      internal_port: 8080

x-runtipi:
  schema_version: 2
